[workspace]
resolver = "2"
members = [
    "crates/mb-core",
    "crates/mb-network",
    "crates/mb-dom",
    "crates/mb-html",
    "crates/mb-js",
    "crates/mb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
slotmap = "1"
thiserror = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
